name: Keep Render Server Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Endpoint
        run: curl -s https://veo3-license-api.onrender.com/api/v1/license/env > /dev/null
